version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: tamildict_db
    environment:
      POSTGRES_DB: tamildict
      POSTGRES_USER: tamildict
      POSTGRES_PASSWORD: tamildict_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamildict"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tamildict_api
    environment:
      DATABASE_URL: postgresql://tamildict:tamildict_secret@db:5432/tamildict
      SECRET_KEY: change_this_in_production_please
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: tamildict_ui
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE: http://localhost:8000

volumes:
  pgdata:
